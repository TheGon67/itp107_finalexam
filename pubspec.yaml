name: post_reader_favorites
description: Retro Post Reader and Favorites for ITP107.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/valley.png
  fonts:
    - family: QuestPixel
      fonts:
        - asset: assets/fonts/quest_pixel.ttf
